<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#111827}#map{position:fixed;inset:0}
.top{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}.brand{pointer-events:auto;background:rgba(17,24,39,.94);color:#fff;padding:11px 14px;border-radius:16px;font-weight:800;box-shadow:0 8px 28px #0003;backdrop-filter:blur(10px)}.brand small{display:block;font-size:11px;font-weight:500;opacity:.65;margin-top:1px}.gps{pointer-events:auto;border:0;border-radius:16px;background:#182033;color:#f8fafc;width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 28px #0003;cursor:pointer}.nearest{position:fixed;z-index:11;right:12px;top:82px;width:52px;height:52px;border:0;border-radius:16px;background:#182033;color:#f8fafc;padding:0;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 28px #0004;cursor:pointer}.suggest{position:fixed;z-index:11;right:12px;top:142px;width:52px;height:52px;border:0;border-radius:16px;background:#182033;color:#f8fafc;padding:0;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 28px #0004;cursor:pointer}.suggestbox{position:fixed;z-index:25;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:#111827;color:#fff;border:1px solid #ffffff1c;border-radius:20px;padding:16px;box-shadow:0 18px 60px #0009;display:none}.suggestbox.open{display:block}.suggestbox h3{margin:0 0 6px}.suggestbox p{margin:0 0 12px;font-size:13px;opacity:.7}.suggesttools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.suggesttools label{background:#ffffff0c;border:1px solid #ffffff18;border-radius:999px;padding:8px 10px}.suggestactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.suggestactions button{border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}.suggestcancel{background:#ffffff12;color:#fff}.suggestsend{background:#2563eb;color:#fff}.pickpin{position:fixed;z-index:24;left:50%;top:50%;transform:translate(-50%,-100%);font-size:34px;display:none;pointer-events:none}.pickpin.show{display:block}.camera{pointer-events:auto;margin-left:auto;display:flex;gap:7px}.compass{position:fixed;z-index:11;right:12px;top:86px;width:44px;height:44px;border:0;border-radius:50%;background:#182033;color:#f8fafc;font-size:22px;box-shadow:0 8px 28px #0004;cursor:pointer;display:none;align-items:center;justify-content:center}.compass.show{display:flex}.compass-arrow{display:block;transition:transform .12s linear}
.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:rgba(17,24,39,.96);color:#fff;border-radius:22px;padding:17px;box-shadow:0 12px 38px #0005;backdrop-filter:blur(12px);display:none}.panel.open{display:block}.row{display:flex;align-items:center;gap:10px}.icon{font-size:28px}.title{font-size:19px;font-weight:850}.sub{font-size:12px;opacity:.58;margin-top:2px}.stationmeta{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 2px}.statuspill,.checkedpill{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:750;border:1px solid #ffffff18;background:#ffffff0d}.statuspill.working{background:#22c55e18;border-color:#22c55e55;color:#86efac}.statuspill.partial{background:#f59e0b18;border-color:#f59e0b55;color:#fcd34d}.statuspill.broken{background:#ef444418;border-color:#ef444455;color:#fca5a5}.statuspill.unknown{color:#cbd5e1}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{background:#ffffff14;border:1px solid #ffffff18;padding:7px 9px;border-radius:999px;font-size:13px}.alertbox{margin:12px 0;padding:12px;border-radius:14px;background:#f59e0b18;border:1px solid #f59e0b55}.alerthead{font-size:12px;font-weight:800;color:#fbbf24;margin-bottom:5px}.alerttext{font-size:14px}.alertdate{font-size:11px;opacity:.55;margin-top:5px}.alertbtn{width:100%;margin:0 0 12px;border:1px solid #ffffff1c;border-radius:13px;background:#ffffff0d;color:#fff;padding:10px;font-weight:700;cursor:pointer}.actions{display:grid;grid-template-columns:1fr auto;gap:9px}.route,.close{border:0;border-radius:14px;padding:12px 14px;font-weight:750;cursor:pointer}.route{background:#182033;color:#f8fafc}.close{background:#ffffff12;color:#fff}.notice{position:fixed;z-index:20;top:86px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:0 5px 20px #0004;display:none;max-width:85%;text-align:center}.station-marker{width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#111827;display:grid;place-items:center;font-size:21px;box-shadow:0 4px 14px #0005;cursor:pointer}.maplibregl-ctrl-attrib{font-size:9px}

.adminopen{position:fixed;z-index:12;right:12px;bottom:54px;border:1px solid #ffffff18;background:#182033;color:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;opacity:.72}.adminmodal{position:fixed;z-index:30;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}.adminmodal.open{display:flex}.adminbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111827;color:#fff;border:1px solid #ffffff18;border-radius:22px;padding:18px;box-shadow:0 18px 60px #0008}.adminhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.adminhead h2{margin:0;font-size:20px}.adminclose{border:0;background:#ffffff12;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.adminform{display:grid;gap:9px;margin-top:16px}.adminform input{width:100%;border:1px solid #ffffff22;background:#0b1220;color:#fff;border-radius:12px;padding:12px;font-size:15px}.adminform button,.adminlogout{border:0;background:#2563eb;color:#fff;border-radius:12px;padding:11px;font-weight:750;cursor:pointer}.adminlogout{background:#ffffff12;margin-top:10px}.photoqueue{display:grid;gap:14px;margin-top:16px}.photocard{border:1px solid #ffffff18;background:#ffffff08;border-radius:16px;padding:12px}.photocard img{width:100%;max-height:420px;object-fit:contain;background:#0b1220;border-radius:12px}.photometa{font-size:12px;opacity:.65;margin:9px 0}.photobuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.approve,.reject{border:0;border-radius:11px;padding:10px;font-weight:800;cursor:pointer}.approve{background:#166534;color:#dcfce7}.reject{background:#7f1d1d;color:#fee2e2}.adminmsg{font-size:13px;opacity:.72;margin-top:10px}.lightbox{position:fixed;z-index:50;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:14px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:92vh;object-fit:contain;border-radius:10px}.lightboxclose{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:46px;height:46px;border:0;border-radius:50%;background:#182033dd;color:#fff;font-size:24px;cursor:pointer}.stationphotos{display:none;gap:8px;overflow-x:auto;overflow-y:hidden;margin:12px 0;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.stationphotos.show{display:flex!important;min-height:109px}.stationphotos img{width:150px;height:105px;min-width:150px;flex:0 0 150px;object-fit:cover;border-radius:13px;border:1px solid #ffffff18;background:#0b1220;cursor:pointer;scroll-snap-align:start}@media(max-width:600px){.panel{max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.stationphotos{width:100%;max-width:100%;}.stationphotos img{width:132px;height:94px;min-width:132px;flex-basis:132px}.adminopen{display:none}}
</style>

<body>
<div id="map"></div>
<div class="top"><div class="brand" id="brand">🔧 Repair Station Map<small>Велоремонтные точки</small></div><div class="camera"><button class="gps" id="gps" aria-label="Моё местоположение">◎</button></div></div><button class="nearest" id="nearest" aria-label="Ближайшая станция" title="Ближайшая станция">🔧</button><button class="suggest" id="suggest" aria-label="Предложить Repair Station" title="Предложить Repair Station">＋</button><div class="pickpin" id="pickPin">📍</div><div class="suggestbox" id="suggestBox"><h3>＋ Предложить Repair Station</h3><p>Передвиньте карту так, чтобы 📍 оказался точно на станции.</p><div class="suggesttools"><label><input type="checkbox" id="sTools" checked> 🛠 Инструменты</label><label><input type="checkbox" id="sRack" checked> 🚲 Стойка</label><label><input type="checkbox" id="sPump" checked> 💨 Насос</label></div><div class="suggestactions"><button class="suggestcancel" id="suggestCancel">Отмена</button><button class="suggestsend" id="suggestSend">Отправить</button></div></div><button class="compass" id="compass" aria-label="Вернуть север наверх" title="Север"><span class="compass-arrow">🧭</span></button>
<div class="notice" id="notice"></div>
<button class="adminopen" id="adminOpen">🔐 Админ</button><div class="lightbox" id="lightbox"><button class="lightboxclose" id="lightboxClose">✕</button><img id="lightboxImg" alt="Фото Repair Station"></div>
<div class="adminmodal" id="adminModal"><div class="adminbox">
 <div class="adminhead"><h2>📷 Модерация фото</h2><button class="adminclose" id="adminClose">✕</button></div>
 <div id="adminLoggedOut">
  <div class="adminform"><input id="adminEmail" type="email" autocomplete="username" placeholder="Email администратора"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Пароль"><button id="adminLogin">Войти</button></div>
  <div class="adminmsg">Доступ только для администратора Repair Station Map.</div>
 </div>
 <div id="adminLoggedIn" style="display:none"><div class="adminmsg" id="adminIdentity"></div><button class="adminlogout" id="adminLogout">Выйти</button><div class="photoqueue" id="photoQueue"></div></div>
</div></div>
<div class="panel" id="panel"><div class="row"><div class="icon">🔧</div><div><div class="title" id="stationTitle">Repair Station</div><div class="sub" id="stationCoords"></div><div class="sub" id="stationDistance"></div></div></div><div class="stationmeta"><span class="statuspill unknown" id="stationStatus">⚪ Статус неизвестен</span><span class="checkedpill" id="lastChecked">Проверка не указана</span></div><div class="tools" id="stationTools"></div><div class="alertbox"><div class="alerthead">⚠️ Последнее сообщение</div><div class="alerttext" id="alertText">Сообщений пока нет</div><div class="alertdate" id="alertDate"></div></div><div class="stationphotos" id="stationPhotos"></div><button class="alertbtn" id="alertBtn">Оставить сообщение о станции</button><button class="alertbtn" id="photoBtn">📷 Предложить фото станции</button><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><div class="actions"><button class="route" id="route">Построить маршрут</button><button class="close" id="close">✕</button></div></div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://fbyzaovfjnagwmvczxjs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_kVGtNH6M4Z3qtPXDKO3j_w_-kk19zwd';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const fallbackStation={id:1,name:'Repair Station',lat:52.231823780917104,lng:20.9849785985799,equipment:['Набор инструментов','Ремонтная стойка','Насос'],status:'unknown',lastChecked:null};
let stations=[], activeStation=fallbackStation, stationMarkers=[];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/fiord',pitch:0,bearing:0,center:[fallbackStation.lng,fallbackStation.lat],zoom:15,attributionControl:true,touchPitch:true,touchZoomRotate:true,dragRotate:true,pitchWithRotate:true});
map.dragPan.enable();map.scrollZoom.enable();map.dragRotate.enable();map.touchZoomRotate.enable();if(map.touchPitch)map.touchPitch.enable();
map.scrollZoom.setWheelZoomRate(1/900);map.scrollZoom.setZoomRate(1/120);

const panel=document.getElementById('panel'), alertText=document.getElementById('alertText'), alertDate=document.getElementById('alertDate');
const stationTitle=document.getElementById('stationTitle'), stationCoords=document.getElementById('stationCoords'), stationDistance=document.getElementById('stationDistance'), stationTools=document.getElementById('stationTools'), stationStatus=document.getElementById('stationStatus'), lastChecked=document.getElementById('lastChecked'), stationPhotos=document.getElementById('stationPhotos'), lightbox=document.getElementById('lightbox'), lightboxImg=document.getElementById('lightboxImg');
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.style.display='block';clearTimeout(window.__nt);window.__nt=setTimeout(()=>n.style.display='none',3000)}
function normalizeStation(s){
 const lat=Number(s.lat??s.latitude),lng=Number(s.lng??s.longitude??s.lon);
 let equipment=s.equipment??s.tools;
 if(equipment==null&&(s.has_tools!==undefined||s.has_rack!==undefined||s.has_pump!==undefined)){
   equipment=[];
   if(s.has_tools)equipment.push('Набор инструментов');
   if(s.has_rack)equipment.push('Ремонтная стойка');
   if(s.has_pump)equipment.push('Насос');
 }
 if(typeof equipment==='string'){try{equipment=JSON.parse(equipment)}catch{equipment=equipment.split(',').map(x=>x.trim()).filter(Boolean)}}
 if(!Array.isArray(equipment))equipment=fallbackStation.equipment;
 return {id:s.id,name:s.name||'Repair Station',lat,lng,equipment,status:s.status||'unknown',lastChecked:s.last_checked??s.lastChecked??null};
}
function equipmentIcon(t){const x=t.toLowerCase();return x.includes('насос')?'💨':x.includes('стой')?'🚲':'🛠'}
function statusInfo(v){const s=String(v||'unknown').toLowerCase();if(['working','works','ok','active'].includes(s))return ['working','🟢 Работает'];if(['partial','partially_working','partly'].includes(s))return ['partial','🟡 Частично работает'];if(['broken','not_working','inactive','down'].includes(s))return ['broken','🔴 Не работает'];return ['unknown','⚪ Статус неизвестен']}
function checkedText(v){if(!v)return 'Проверка не указана';const d=new Date(v);return Number.isNaN(d.getTime())?'Проверка не указана':'Проверено: '+d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function renderStation(s){
 activeStation=s;
 stationTitle.textContent=s.name==='Repair Station #001'?'Repair Station':s.name;
 stationCoords.textContent=`${s.lat}, ${s.lng}`;
 stationDistance.textContent=currentUserLngLat?('📍 '+formatDistance(distanceMeters(currentUserLngLat[1],currentUserLngLat[0],s.lat,s.lng))+' от вас'):'';
 const [statusClass,statusLabel]=statusInfo(s.status);stationStatus.className='statuspill '+statusClass;stationStatus.textContent=statusLabel;lastChecked.textContent=checkedText(s.lastChecked);
 stationTools.innerHTML='';
 s.equipment.forEach(t=>{const e=document.createElement('span');e.className='chip';e.textContent=`${equipmentIcon(String(t))} ${t}`;stationTools.appendChild(e)});
 alertText.textContent='Загрузка…';alertDate.textContent='';
 loadAlert(s.id);loadApprovedPhotos(s.id);panel.classList.add('open');
}
function addMarker(s){
 const el=document.createElement('div');el.className='station-marker';el.textContent='🔧';el.title=s.name;
 const marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([s.lng,s.lat]).addTo(map);
 el.onclick=e=>{e.stopPropagation();renderStation(s)};stationMarkers.push(marker);
}
async function loadStations(){
 try{
  const {data,error}=await db.from('stations').select('*').order('id',{ascending:true});
  if(error)throw error;
  stations=(data||[]).map(normalizeStation).filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng));
  if(!stations.length)throw new Error('Таблица stations пуста');
 }catch(e){
  console.warn('Stations fallback:',e);stations=[fallbackStation];
 }
 stationMarkers.forEach(m=>m.remove());stationMarkers=[];stations.forEach(addMarker);
}
document.getElementById('close').onclick=()=>panel.classList.remove('open');
document.getElementById('route').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${activeStation.lat},${activeStation.lng}`,'_blank');

let userMarker=null,currentUserLngLat=null;
function distanceMeters(lat1,lng1,lat2,lng2){const R=6371000,toRad=x=>x*Math.PI/180;const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function formatDistance(m){return m<1000?Math.round(m)+' м':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' км'}
function setUserLocation(p,fly=true){const ll=[p.coords.longitude,p.coords.latitude];currentUserLngLat=ll;if(userMarker)userMarker.remove();const u=document.createElement('div');u.style.cssText='width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;box-shadow:0 2px 10px #0006';userMarker=new maplibregl.Marker({element:u}).setLngLat(ll).addTo(map);if(fly)map.flyTo({center:ll,zoom:16});return ll}
function getLocation(cb){if(!navigator.geolocation){notice('Геолокация не поддерживается');return}navigator.geolocation.getCurrentPosition(p=>{setUserLocation(p,false);cb(p)},()=>notice('Не удалось получить геолокацию. Разрешите доступ к местоположению.'),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}
document.getElementById('gps').onclick=()=>getLocation(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:16}));
document.getElementById('nearest').onclick=()=>{
 const go=()=>{
  if(!stations.length){notice('Станции пока не загружены');return}
  let best=null,bestD=Infinity;
  for(const s of stations){const d=distanceMeters(currentUserLngLat[1],currentUserLngLat[0],s.lat,s.lng);if(d<bestD){bestD=d;best=s}}
  if(!best)return;
  map.flyTo({center:[best.lng,best.lat],zoom:16});renderStation(best);notice('Ближайшая станция: '+formatDistance(bestD));
 };
 if(currentUserLngLat)go();else getLocation(()=>go());
};
const suggestBox=document.getElementById('suggestBox'),pickPin=document.getElementById('pickPin');
let suggesting=false;
document.getElementById('suggest').onclick=()=>{suggesting=true;panel.classList.remove('open');suggestBox.classList.add('open');pickPin.classList.add('show');notice('Передвиньте карту и поставьте 📍 на Repair Station')};
document.getElementById('suggestCancel').onclick=()=>{suggesting=false;suggestBox.classList.remove('open');pickPin.classList.remove('show')};
document.getElementById('suggestSend').onclick=()=>{const center=map.getCenter();const payload={lat:center.lat,lng:center.lng,has_tools:document.getElementById('sTools').checked,has_rack:document.getElementById('sRack').checked,has_pump:document.getElementById('sPump').checked};if(!payload.has_tools&&!payload.has_rack&&!payload.has_pump){notice('Отметьте хотя бы одно оборудование');return}localStorage.setItem('pending_station_suggestion',JSON.stringify(payload));suggesting=false;suggestBox.classList.remove('open');pickPin.classList.remove('show');notice('Точка выбрана. Подключаем отправку на модерацию следующим шагом.')};


const photoBtn=document.getElementById('photoBtn'),photoInput=document.getElementById('photoInput');
photoBtn.onclick=()=>photoInput.click();
photoInput.onchange=async()=>{const file=photoInput.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){notice('Можно загрузить только изображение');return}if(file.size>6*1024*1024){notice('Фото слишком большое. Максимум 6 МБ');return}photoBtn.disabled=true;photoBtn.textContent='Загрузка…';try{const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();const path=`pending/${activeStation.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error:upErr}=await db.storage.from('station-photos').upload(path,file,{contentType:file.type,upsert:false});if(upErr)throw upErr;const {error:rowErr}=await db.from('station_photos').insert({station_id:activeStation.id,storage_path:path,moderation_status:'pending'});if(rowErr){await db.storage.from('station-photos').remove([path]);throw rowErr}notice('Спасибо! Фото отправлено на модерацию.');}catch(e){console.error(e);notice('Не удалось отправить фото. Проверь настройку Supabase.')}finally{photoBtn.disabled=false;photoBtn.textContent='📷 Предложить фото станции';photoInput.value=''}};

async function loadApprovedPhotos(stationId){
 stationPhotos.classList.remove('show');stationPhotos.innerHTML='';
 const {data,error}=await db.from('station_photos').select('id,storage_path').eq('station_id',stationId).eq('moderation_status','approved').order('created_at',{ascending:false});
 if(error){console.warn('Approved photos:',error);return}
 for(const p of data||[]){
   const raw=String(p.storage_path||'').trim();
   const candidates=[raw,raw.replace(/^\/+/,''),raw.replace(/^station-photos\//,'')].filter((v,i,a)=>v&&a.indexOf(v)===i);
   let url=null;
   for(const path of candidates){
     const {data:signed,error:urlError}=await db.storage.from('station-photos').createSignedUrl(path,3600);
     if(!urlError&&signed?.signedUrl){url=signed.signedUrl;break}
   }
   if(!url){console.warn('Photo object not found:',raw);continue}
   const img=document.createElement('img');img.src=url;img.alt='Фото Repair Station';img.loading='eager';img.onclick=()=>{lightboxImg.src=url;lightbox.classList.add('open')};stationPhotos.appendChild(img);
 }
 if(stationPhotos.children.length)stationPhotos.classList.add('show');
}
async function loadAlert(stationId){
 const {data,error}=await db.from('station_reports').select('message,status,created_at').eq('station_id',stationId).order('created_at',{ascending:false}).limit(1);
 if(error){console.warn(error);alertText.textContent='Не удалось загрузить сообщения';return}
 const a=data?.[0];
 if(a){
   alertText.textContent=a.message;alertDate.textContent=new Date(a.created_at).toLocaleString('ru-RU');
   if(a.status){
     activeStation.status=a.status;activeStation.lastChecked=a.created_at;
     const [statusClass,statusLabel]=statusInfo(a.status);stationStatus.className='statuspill '+statusClass;stationStatus.textContent=statusLabel;lastChecked.textContent=checkedText(a.created_at);
   }
 }else{alertText.textContent='Сообщений пока нет';alertDate.textContent=''}
}
document.getElementById('alertBtn').onclick=async()=>{
 const choice=prompt('Состояние станции:\n1 — 🟢 Работает\n2 — 🟡 Частично работает\n3 — 🔴 Не работает\n\nВведите 1, 2 или 3');
 if(choice===null)return;
 const statusMap={'1':'working','2':'partial','3':'broken'};
 const newStatus=statusMap[choice.trim()];
 if(!newStatus){notice('Выберите 1, 2 или 3');return}
 const t=prompt('Добавьте короткое сообщение. Например: «Насос не работает». Можно оставить пустым.');
 if(t===null)return;
 const message=(t.trim()||({'working':'Всё работает','partial':'Станция работает частично','broken':'Станция не работает'}[newStatus])).slice(0,500);
 const now=new Date().toISOString();
 const {error:reportError}=await db.from('station_reports').insert({station_id:activeStation.id,message,status:newStatus});
 if(reportError){console.error(reportError);notice('Не удалось отправить сообщение.');return}
 activeStation.status=newStatus;activeStation.lastChecked=now;
 const [statusClass,statusLabel]=statusInfo(newStatus);stationStatus.className='statuspill '+statusClass;stationStatus.textContent=statusLabel;lastChecked.textContent=checkedText(now);
 alertText.textContent=message;alertDate.textContent=new Date(now).toLocaleString('ru-RU');notice('Статус и сообщение опубликованы для всех');
};

const compass=document.getElementById('compass'),compassArrow=compass.querySelector('.compass-arrow');
function updateCompass(){const b=map.getBearing();compass.classList.toggle('show',Math.abs(b)>0.8);compassArrow.style.transform=`rotate(${-b}deg)`}
map.on('rotate',updateCompass);map.on('moveend',updateCompass);compass.onclick=()=>map.easeTo({bearing:0,duration:350});updateCompass();

map.on('load',()=>{loadStations();try{if(!map.getLayer('repair-3d-buildings'))map.addLayer({id:'repair-3d-buildings',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#33465a','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],'fill-extrusion-opacity':0.72}})}catch(e){console.warn('3D buildings:',e)}});

document.getElementById('lightboxClose').onclick=()=>{lightbox.classList.remove('open');lightboxImg.src=''};lightbox.onclick=e=>{if(e.target===lightbox){lightbox.classList.remove('open');lightboxImg.src=''}};
const adminModal=document.getElementById('adminModal'),adminLoggedOut=document.getElementById('adminLoggedOut'),adminLoggedIn=document.getElementById('adminLoggedIn'),photoQueue=document.getElementById('photoQueue');
document.getElementById('adminOpen').onclick=async()=>{adminModal.classList.add('open');await refreshAdmin()};
const brand=document.getElementById('brand');
let adminPressTimer=null,adminLongPressed=false;
function startAdminPress(e){
 if(window.innerWidth>600)return;
 adminLongPressed=false;
 adminPressTimer=setTimeout(async()=>{adminLongPressed=true;adminModal.classList.add('open');await refreshAdmin();if(navigator.vibrate)navigator.vibrate(35)},900);
}
function cancelAdminPress(){clearTimeout(adminPressTimer);adminPressTimer=null}
brand.addEventListener('touchstart',startAdminPress,{passive:true});
brand.addEventListener('touchend',cancelAdminPress,{passive:true});
brand.addEventListener('touchcancel',cancelAdminPress,{passive:true});
brand.addEventListener('touchmove',cancelAdminPress,{passive:true});
document.getElementById('adminClose').onclick=()=>adminModal.classList.remove('open');
adminModal.onclick=e=>{if(e.target===adminModal)adminModal.classList.remove('open')};
async function refreshAdmin(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){adminLoggedOut.style.display='block';adminLoggedIn.style.display='none';return}
 const {data:isAdmin,error}=await db.rpc('is_admin');
 if(error||!isAdmin){await db.auth.signOut();adminLoggedOut.style.display='block';adminLoggedIn.style.display='none';notice('У этого аккаунта нет прав администратора');return}
 adminLoggedOut.style.display='none';adminLoggedIn.style.display='block';document.getElementById('adminIdentity').textContent='Вход выполнен: '+(session.user.email||'администратор');await loadPendingPhotos();
}
document.getElementById('adminLogin').onclick=async()=>{
 const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;
 if(!email||!password){notice('Введите email и пароль');return}
 const b=document.getElementById('adminLogin');b.disabled=true;b.textContent='Вход…';
 const {error}=await db.auth.signInWithPassword({email,password});b.disabled=false;b.textContent='Войти';
 if(error){console.error(error);notice('Не удалось войти. Проверьте email и пароль.');return}
 document.getElementById('adminPassword').value='';await refreshAdmin();
};
document.getElementById('adminLogout').onclick=async()=>{await db.auth.signOut();photoQueue.innerHTML='';await refreshAdmin()};
async function loadPendingPhotos(){
 photoQueue.innerHTML='<div class="adminmsg">Загрузка фотографий…</div>';
 const {data,error}=await db.from('station_photos').select('id,station_id,storage_path,moderation_status,created_at').eq('moderation_status','pending').order('created_at',{ascending:true});
 if(error){console.error(error);photoQueue.innerHTML='<div class="adminmsg">Не удалось загрузить очередь.</div>';return}
 if(!data?.length){photoQueue.innerHTML='<div class="adminmsg">🎉 Очередь пуста — новых фото нет.</div>';return}
 photoQueue.innerHTML='';
 for(const p of data){
  const {data:signed,error:urlError}=await db.storage.from('station-photos').createSignedUrl(p.storage_path,600);
  const card=document.createElement('div');card.className='photocard';
  if(urlError||!signed?.signedUrl){card.innerHTML='<div class="adminmsg">Не удалось открыть фото #'+p.id+'</div>';photoQueue.appendChild(card);continue}
  const img=document.createElement('img');img.src=signed.signedUrl;img.alt='Фото на модерации';card.appendChild(img);
  const meta=document.createElement('div');meta.className='photometa';meta.textContent='Фото #'+p.id+' · Repair Station #'+p.station_id+' · '+new Date(p.created_at).toLocaleString('ru-RU');card.appendChild(meta);
  const buttons=document.createElement('div');buttons.className='photobuttons';
  const approve=document.createElement('button');approve.className='approve';approve.textContent='✅ Одобрить';approve.onclick=()=>moderatePhoto(p.id,'approved',card);
  const reject=document.createElement('button');reject.className='reject';reject.textContent='❌ Отклонить';reject.onclick=()=>moderatePhoto(p.id,'rejected',card);
  buttons.append(approve,reject);card.appendChild(buttons);photoQueue.appendChild(card);
 }
}
async function moderatePhoto(id,status,card){
 const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);
 const {error}=await db.from('station_photos').update({moderation_status:status,reviewed_at:new Date().toISOString()}).eq('id',id);
 if(error){console.error(error);buttons.forEach(b=>b.disabled=false);notice('Не удалось изменить статус фото');return}
 card.remove();notice(status==='approved'?'Фото одобрено':'Фото отклонено');
 if(!photoQueue.querySelector('.photocard'))photoQueue.innerHTML='<div class="adminmsg">🎉 Очередь пуста — новых фото нет.</div>';
}

map.on('click',e=>{
 if(panel.classList.contains('open'))panel.classList.remove('open');
});
map.on('error',e=>{if(e&&e.error)console.warn(e.error)});
