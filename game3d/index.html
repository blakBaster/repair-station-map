<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warsaw Runner 3D</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="ui">
  <div class="title">WARSAW RUNNER 3D <span>prototype</span></div>
  <div class="hint">WASD — движение · Shift — бег · мышь — камера · E — станция</div>
  <div id="stationHint" class="station-hint hidden">E — взаимодействовать со станцией</div>
  <div id="status" class="status">Загрузка мира…</div>
</div>
<div id="stationPanel" class="panel hidden">
  <button id="closePanel">×</button>
  <div class="eyebrow">REPAIR STATION</div>
  <h2 id="stationName"></h2>
  <p id="stationStatus"></p>
  <div id="stationEquipment" class="chips"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="./game.js"></script>
</body>
</html>
